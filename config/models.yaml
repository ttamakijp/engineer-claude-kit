# Model registry - LOCAL OVERRIDE for personal Arch Linux (Anthropic direct).
# The upstream kit ships Bedrock IDs; this checkout is adapted to Anthropic-direct
# model IDs so `apply -Global` reproduces the adapted deployment (no revert to Bedrock).
# This is the single source of truth for model IDs.

models:
  main:
    id: claude-opus-5
    family: opus-5
    cache_1h_supported: true
  small-fast:
    id: claude-haiku-4-5-20251001
    family: haiku-4-5
    cache_1h_supported: true

# Role mapping for sub-agents
# These resolve to model IDs above via "role-of"
roles:
  architect:
    role-of: main
  review:
    role-of: main
  debug-analyze:
    role-of: main
  commit-msg:
    role-of: small-fast
  lint-helper:
    role-of: small-fast
  log-summary:
    role-of: small-fast
